<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم | أمسية الاثنين</title>

<link rel="stylesheet" href="style.css">

<style>

.admin{
max-width:900px;
margin:60px auto;
padding:30px;
background:#171717;
border-radius:20px;
}

.admin h1{
color:#d4b06a;
margin-bottom:25px;
}

label{
display:block;
margin-top:20px;
margin-bottom:8px;
font-size:18px;
}

input,textarea{
width:100%;
padding:12px;
background:#0f0f0f;
border:1px solid #333;
color:white;
border-radius:10px;
font-family:Cairo;
}

textarea{
height:180px;
resize:vertical;
}

button{
margin-top:25px;
padding:15px 30px;
border:none;
border-radius:10px;
background:#65152b;
color:white;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#8c1c3b;
}

</style>

</head>

<body>

<div class="admin">

<h1>لوحة المؤلف</h1>

<label>عنوان الفصل</label>

<input id="title" type="text">

<label>رقم الفصل</label>

<input id="chapter" type="number">

<label>رفع ملف PDF</label>

<input id="pdf" type="file" accept=".pdf">

<button id="save">
حفظ الفصل
</button>

</div>

<script src="admin.js"></script>

</body>

</html>
